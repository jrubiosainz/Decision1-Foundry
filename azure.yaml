# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: decision1-foundry
metadata:
  template: decision1-foundry@1.0.0
services:
  web:
    project: ./src
    language: py
    host: appservice
# interactive: true connects the hook to the console; without it, azd hides its output when it finishes.
hooks:
  preprovision:
    posix:
      shell: sh
      run: ./scripts/access-code.sh
      interactive: true
    windows:
      shell: pwsh
      run: ./scripts/access-code.ps1
      interactive: true
  postdeploy:
    posix:
      shell: sh
      run: echo "Demo ready -> ${WEB_URL}/?code=${DEMO_ACCESS_CODE}"
      interactive: true
    windows:
      shell: pwsh
      run: Write-Host "Demo ready -> $env:WEB_URL/?code=$env:DEMO_ACCESS_CODE"
      interactive: true
